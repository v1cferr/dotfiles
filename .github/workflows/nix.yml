# THE QUALITY CI: on every push it runs EXACTLY the local `nix flake check` gate, with the
# private input stubbed by --override-input (no deploy key needed): docs/notes/repo/flake.md
name: nix

on:
  push:
    branches: [nixos]
  pull_request:
  workflow_dispatch: # it allows running by hand from the Actions tab

# A push in sequence cancels the previous run of the same ref: without this, three commits in a
# row queue three CIs and only the last one matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token drops to READ-ONLY: this job clones and checks, it never writes back. Without the block
# it inherits the default write scope, which is what zizmor reports as excessive-permissions.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # PINNED BY HASH, which is rule 13 applied to the CI: `@v7` is a POINTER the author can move,
      # the same class of trap as VS Code's `/latest/`. The tag stays in the comment, for reading.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Or the token stays in .git/config for every later step to read (zizmor's artipacked).
          persist-credentials: false

      # cachix/install-nix-action and NOT the Determinate one: that distribution ended its upstream
      # Nix support on 01/01/2026 and pulls toward FlakeHub. Switching later is 1 line.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ONE command = the WHOLE gate: the linters, the host's evaluation and the BUILD of the repo's
      # packages. The --override-input is what removes the need for a credential.
      - name: nix flake check (linters + host + the packages build)
        run: nix flake check --override-input duo-streak-daemon path:./ci/stub-duo

# PLAN B, only if a module ever READS from the private repo at eval time and the empty stub stops
# doing: a DEDICATED deploy key, never a personal one. The 4 steps: docs/notes/repo/flake.md
