ddns.global=ddns
ddns.global.ddns_dateformat='%F %R'
ddns.global.ddns_loglines='250'
ddns.global.upd_privateip='0'
ddns.ssh_anchor=service
ddns.ssh_anchor.enabled='1'
ddns.ssh_anchor.service_name='cloudflare.com-v4'
ddns.ssh_anchor.lookup_host='ssh.v1cferr.dev'
ddns.ssh_anchor.domain='ssh@v1cferr.dev'
ddns.ssh_anchor.username='Bearer'
ddns.ssh_anchor.use_api_check='1'
ddns.ssh_anchor.interface='wan'
ddns.ssh_anchor.ip_source='network'
ddns.ssh_anchor.ip_network='wan'
ddns.ssh_anchor.use_https='1'
ddns.ssh_anchor.cacert='/etc/ssl/certs/ca-certificates.crt'
ddns.ssh_anchor.check_interval='10'
ddns.ssh_anchor.check_unit='minutes'
ddns.ssh_anchor.force_interval='72'
ddns.ssh_anchor.force_unit='hours'
ddns.ssh_anchor.retry_interval='60'
ddns.ssh_anchor.retry_unit='seconds'
ddns.ssh_anchor.password='<REDACTED: the real value is on the router; see docs/history/>'
ddns.vpn_anchor=service
ddns.vpn_anchor.enabled='1'
ddns.vpn_anchor.service_name='cloudflare.com-v4'
ddns.vpn_anchor.lookup_host='vpn.v1cferr.dev'
ddns.vpn_anchor.domain='vpn@v1cferr.dev'
ddns.vpn_anchor.username='Bearer'
ddns.vpn_anchor.use_api_check='1'
ddns.vpn_anchor.interface='wan'
ddns.vpn_anchor.ip_source='network'
ddns.vpn_anchor.ip_network='wan'
ddns.vpn_anchor.use_https='1'
ddns.vpn_anchor.cacert='/etc/ssl/certs/ca-certificates.crt'
ddns.vpn_anchor.check_interval='10'
ddns.vpn_anchor.check_unit='minutes'
ddns.vpn_anchor.force_interval='72'
ddns.vpn_anchor.force_unit='hours'
ddns.vpn_anchor.retry_interval='60'
ddns.vpn_anchor.retry_unit='seconds'
ddns.vpn_anchor.password='<REDACTED: the real value is on the router; see docs/history/>'
