# Codex CLI config, the DECLARED layer: installed read-only as /etc/codex/config.toml, Codex's
# system layer. ~/.codex/config.toml stays Codex's own (/model, approvals, trusted projects)
# and overrides any key it repeats. Why the split: docs/notes/apps/codex.md

# The ChatGPT subscription is the credential, never an API key pasted into a shell (rule 12).
forced_login_method = "chatgpt"
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

# Auto mode PINNED, so it does not ride on whatever the default is per release. It runs commands
# on its own, and the sandbox is what bounds that: workspace only, no network.
sandbox_mode = "workspace-write"
approval_policy = "never"

[projects."/home/v1cferr/Projects/GitHub/v1cferr/dotfiles"]
trust_level = "trusted"

# No app-server daemon: it copies itself out of the store into ~/.codex/packages and self-updates.
[features]
daemon_auto_start = false
in_app_updates = false

[tui]
theme = "dracula"

# The GENERAL memory server (modules/home/services/basic-memory.nix), never the FAI one. This file
# is the one consumer that cannot read `my.memory.servers.general.url`, so the port is a literal.
[mcp_servers.basic-memory]
url = "http://127.0.0.1:8765/mcp"
