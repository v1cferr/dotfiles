# ═══════════════════════════════════════════════════════════════════════════════
# CI DE QUALIDADE — roda em cada push EXATAMENTE o gate do `nix flake check` local.
#
# POR QUE existe: o gate do flake (checks.x86_64-linux em flake.nix) só roda quando
# alguém DIGITA `nix flake check`. Padrão que depende de lembrar é intenção, não
# padrão — e a intenção é a primeira coisa a evaporar num rebuild às pressas em 2027.
#
# POR QUE HOJE É `nix flake check` DE VERDADE (mudou em 04/08/2026): este flake tem um
# input PRIVADO
#   duo-streak-daemon = ssh://git@github.com/v1cferr/duo-streak-daemon.git
# e o Nix busca TODOS os inputs travados no lock ao avaliar o flake — não só os que a
# saída pedida usa. Por isso o CI antes rodava statix/deadnix/nixfmt direto do nixpkgs:
# assim o flake LOCAL nunca era avaliado e nenhuma credencial entrava na jogada. O preço
# era duplo e está registrado abaixo. A saída foi `--override-input`, que troca o input
# ANTES do fetch por um diretório VAZIO versionado em ci/stub-duo — nenhuma deploy key,
# nenhum segredo no Actions, e o flake avalia inteiro. Verificado em 04/08/2026:
# "checking NixOS configuration 'nixosConfigurations.nixos-kingston'" + "all checks
# passed!". Por que vazio basta: ver ci/stub-duo/.gitkeep.
#
# O QUE ISSO COMPROU, e eram dois furos reais:
#   1. O CI não verificava que `nixosConfigurations.nixos-kingston` AVALIA — erro de
#      módulo passava verde e só aparecia no `rebuild`. Agora reprova aqui.
#   2. Os três `nix run` eram uma TERCEIRA definição da mesma regra que flake.nix e o
#      hook de pre-commit já definiam: drift silencioso da regra 14 esperando acontecer
#      (o gate passa, o hook reprova, ninguém entende por quê). Agora é UMA definição,
#      e mexer nos hooks do flake.nix muda o CI automaticamente — sem editar este
#      arquivo. Some também o `env NIXPKGS` que existia só pra fixar a versão dos
#      linters: eles agora vêm do flake.lock, iguais aos de casa por construção.
#
# ⚠️ O CUSTO, aceito de propósito: o `flake check` busca TODOS os inputs (~1,43 GiB em
# 19 inputs) e avalia a config inteira, então o CI passou de segundos para minutos. A
# troca é tempo de máquina por cobertura e por uma definição só. Se um dia incomodar, o
# caminho de volta é este arquivo no histórico — não desfazer o ci/stub-duo, que é útil
# de qualquer forma pra rodar `flake check` em qualquer clone sem a chave privada.
# ═══════════════════════════════════════════════════════════════════════════════
name: nix

on:
  push:
    branches: [nixos]
  pull_request:
  workflow_dispatch: # permite rodar na mão pela aba Actions

# Push em sequência cancela a execução anterior do mesmo ref: sem isto, três commits
# seguidos enfileiram três CIs e só o último interessa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cachix/install-nix-action e NÃO DeterminateSystems/nix-installer-action: o
      # segundo é mais rápido e traz cache de graça, mas instala a distribuição
      # Determinate Nix (o suporte dele a Nix upstream terminou em 01/01/2026) e puxa
      # pro FlakeHub Cache. Pra um repo pessoal que precisa durar até 2032+, Nix
      # upstream sem vendor é a aposta mais segura — trocar depois é 1 linha.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # UM comando = o gate inteiro: os três linters (hooks declarados em flake.nix),
      # a avaliação do host e os demais outputs do flake. O --override-input é o que
      # dispensa credencial pro input privado (ver cabeçalho).
      - name: nix flake check (linters + avaliação do host)
        run: nix flake check --override-input duo-streak-daemon path:./ci/stub-duo

# ── PLANO B: deploy key, se o stub vazio algum dia NÃO servir ───────────────────
# Só é necessário se um módulo passar a LER conteúdo do repo privado em tempo de
# avaliação (hoje `system/services/duo.nix` só usa o input como contexto de build do
# Docker). Nesse dia o stub precisaria do arquivo lido — se isso ficar impraticável:
# 1. Gerar um par de chaves só pra isso:  ssh-keygen -t ed25519 -f ci_key -N ""
# 2. Pública  → repo duo-streak-daemon → Settings → Deploy keys (só leitura).
# 3. Privada  → repo dotfiles → Settings → Secrets → Actions → SSH_PRIVATE_KEY.
# 4. Antes do check:
#      - uses: webfactory/ssh-agent@v0.9.0
#        with: { ssh-private-key: "${{ secrets.SSH_PRIVATE_KEY }}" }
#    e tirar o --override-input do comando acima.
# Chave DEDICADA, nunca a sua pessoal: deploy key some do repo com um clique, chave
# pessoal comprometida é o teu GitHub inteiro.
