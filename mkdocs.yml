# THE SITE: it publishes docs/ at dotfiles.v1cferr.dev, with the tree left exactly where it is.
# Why the nav is written here and not mirrored by folders: docs/notes/repo/site.md

site_name: dotfiles
site_description: My declarative NixOS and home-manager system, module by module.
site_url: https://dotfiles.v1cferr.dev/
docs_dir: docs

repo_url: https://github.com/v1cferr/dotfiles
repo_name: v1cferr/dotfiles
# `nixos` is the DEFAULT branch, and `main` is a separate orphan history: the edit link built
# from the wrong one is a 404 on every page.
edit_uri: edit/nixos/docs/

# The 134 links from a page to the module it documents, which live OUTSIDE docs_dir.
hooks:
  - scripts/mkdocs-hooks.py

# THE GATE: `warn` is the strongest value these options take (`error` is refused), and --strict
# in the derivation is what turns each one into a build failure.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    absolute_links: warn
    # `info` and not `warn`: 2 of the 252 links carry an anchor, so a heading rename is real drift
    # but promoting it here would fail the build for almost nothing.
    anchors: info

theme:
  name: material
  language: en
  # It holds ONE override: the vendored mermaid, so no page reaches for a CDN.
  custom_dir: overrides
  # NO Google Fonts. The default links Roboto from gstatic on every page, which sends every
  # reader to a third party to render text: the stack is in assets/stylesheets/fonts.css.
  font: false
  features:
    # No `navigation.tabs`: twelve top-level sections overflow the tab bar and start scrolling.
    - navigation.sections
    - navigation.indexes # a folder's README becomes the section's own page
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit # it lands on the file in GitHub, through edit_uri above
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/stylesheets/fonts.css

plugins:
  - search

markdown_extensions:
  # NOTHING here may be a typographic prettifier (`smarty`, `pymdownx.smartsymbols`): they turn
  # `--` into an em dash, which rule 17 bans, and the ban would then be broken by the renderer.
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Mermaid, which GitHub renders from the same fence: one source, two renderers.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# THE NAV IS THE ONLY TOPIC LAYER (rule 20): the FILES stay grouped the way the repo needs them
