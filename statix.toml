# statix's config. Two lints are turned off below, and it is a decision, not annoyance: a lint
# we ignore in practice trains the eye to skip the real finding too. Why: docs/notes/flake.md

disabled = [
  # repeated_keys: the DOTTED PATH is nixpkgs' idiom, it keeps the diff per-service isolated, and
  # nesting would push this repo's comments to 4 levels of indentation.
  "repeated_keys",

  # empty_pattern: `{ ... }:` IS the NixOS module signature, which `_:` does not convey. The weaker
  # of the two arguments; changing my mind is deleting this line and running `statix fix`.
  "empty_pattern",
]
