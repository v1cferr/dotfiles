# Regras do sops. As chaves PÚBLICAS abaixo são quem CONSEGUE decriptar; a privada de
# cada uma vive FORA do git. DOIS destinatários de propósito:
#   host   → /var/lib/sops-nix/key.txt na máquina; é o que o sops-nix usa no boot pra
#            popular /run/secrets, e o que se carrega no cutover. O anchor dizia
#            `nixos_seagate` até 04/08/2026: a chave NASCEU naquele host e foi carregada
#            no cutover pro Kingston (01/08/2026) — mesma chave, host novo, nome velho.
#   backup → chave OFFLINE (gerada 04/08/2026), que NÃO fica em máquina nem em nuvem em
#            texto claro. Existe porque destinatário ÚNICO = perda IRREVERSÍVEL de todo
#            segredo do repo no dia em que aquela chave sumir: o sops não tem recuperação,
#            e o único backup dela era o Bitwarden (SPOF de tudo). Com duas, perder uma
#            é aborrecimento; perder as duas é que é desastre.
# Editar segredos:   nix shell nixpkgs#sops -c sops secrets/secrets.yaml
# Re-encriptar p/ novas chaves:   nix shell nixpkgs#sops -c sops updatekeys secrets/secrets.yaml
#
# ⚠️ `creation_rules` só vale pra arquivo NOVO. Adicionar destinatário aqui NÃO
# re-encripta o que já existe — sem rodar `updatekeys`, a chave nova não decripta nada e
# o backup é imaginário. E o regex pega só `secrets/*.yaml`: o bitwarden-secrets.json é
# texto claro de PROPÓSITO (mapa nome-no-sops → item-no-Bitwarden, sem credencial), mas
# um .json que algum dia contenha segredo NÃO seria encriptado por esta regra.
keys:
  - &host_nixos_kingston age132kmspxjsqzc3nnd6407svq744ju4q6vl85hq2v02pgqc2yf7caq03plfn
  - &backup_offline age1eexkwwdh60rxp78407dq4d5xcmzanupnh8f4l4llpukhq0fmxv0ql5lnvk
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *host_nixos_kingston
          - *backup_offline
