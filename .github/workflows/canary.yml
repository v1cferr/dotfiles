# THE CANARY: once a week it asks what the gate cannot, because the answer changes with NO commit
# of mine: would the next `update` break me, and did a link in docs/ rot: docs/notes/repo/flake.md
name: canary

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC, an odd minute to dodge the top-of-hour queue
  workflow_dispatch: # it allows running by hand from the Actions tab

# Nothing here writes: it reads the repo and reports through the run's own status.
permissions:
  contents: read

# No cancel-in-progress: a weekly run has nothing to supersede, and a manual run should not kill it.
concurrency:
  group: ${{ github.workflow }}

jobs:
  inputs:
    name: would the next update break this config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --recreate-lock-file resolves EVERY input at its branch head and --no-write-lock-file leaves
      # the committed pin alone: this measures BREAKAGE, never the age of a pin (rule 13 stands).
      # abort-on-warn turns an upstream DEPRECATION into a red Monday, a release before it breaks.
      - name: nix flake check against the channel heads
        run: |
          nix flake check -L --keep-going --option abort-on-warn true \
            --recreate-lock-file --no-write-lock-file \
            --override-input duo-streak-daemon path:./tools/ci/stub-duo

  links:
    name: the external links in docs/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # It runs the `manual`-stage lychee hook, so the version and the flags live in flake.nix next
      # to every other linter instead of in a marketplace action (rule 13, and one definition).
      - name: lychee over the markdown
        env:
          # github.com is 10 of the links: without a token the runner's shared IP hits the API limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 3 tries, 2 min apart: lychee never retries a 5xx, and both reds so far were a server's
        # blip (522, 503). A link dead 3 times in 4 minutes is dead: docs/notes/repo/link-checker.md
        run: |
          for try in 1 2 3; do
            nix develop --override-input duo-streak-daemon path:./tools/ci/stub-duo \
              --command pre-commit run --hook-stage manual lychee --all-files && exit 0
            [ "$try" -lt 3 ] && echo "::warning::lychee failed, try $try of 3" && sleep 120
          done
          exit 1

      # THE OTHER HALF, which the step above cannot see: the links from a page to the module it
      # documents only EXIST in the built site, written there by the site's own remark plugin
      # (notes/repo/site.md).
      - name: lychee over the links the site generates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          site=$(nix build .#docs-site --no-link --print-out-paths \
            --override-input duo-streak-daemon path:./tools/ci/stub-duo)
          # The pattern is READ from tools/docs-site/site.json, which already owns the repo for the
          # link rewriting: hardcoding it here would be the second owner that file exists to
          # avoid. The runner's own node parses it, so this needs nothing from the devShell.
          repo=$(node -p "require('./tools/docs-site/site.json').repo")
          # THE HTML ONLY. Next.js writes a plain-text RSC payload next to every page, and lychee
          # reads those as prose: a `file://...` inside backticks became a parse ERROR there.
          # The same 3 tries as the step above, for the same reason.
          for try in 1 2 3; do
            nix develop --override-input duo-streak-daemon path:./tools/ci/stub-duo --command \
              lychee --root-dir "$site" --include "$repo/(blob|tree)/" \
              --scheme https --scheme http \
              --max-concurrency 6 --no-progress "$site/**/*.html" && exit 0
            [ "$try" -lt 3 ] && echo "::warning::lychee failed, try $try of 3" && sleep 120
          done
          exit 1

  # The WHOLE history, which the pre-commit hook never sees: a `--no-verify` commit, or a rule a
  # newer gitleaks learned. Known findings: .config/.gitleaksignore, and docs/notes/repo/github-settings.md
  secrets:
    name: no credential anywhere in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # every commit, or this scans one

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The devShell's gitleaks, so the version is the hook's and lives in flake.nix.
      - name: gitleaks over every commit
        run: |
          nix develop --override-input duo-streak-daemon path:./tools/ci/stub-duo \
            --command gitleaks git --no-banner --redact \
            --config .config/gitleaks.toml --gitleaks-ignore-path .config .

  # An advisory published against a pinned dependency changes the answer with NO commit of mine:
  # every lockfile osv-scanner reads (uv.lock, pnpm-lock.yaml): docs/notes/repo/github-settings.md
  advisories:
    name: no known vulnerability in the lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --inputs-from: the scanner is the nixpkgs of THIS lock, not the registry's (rule 13).
      - name: osv-scanner over every lockfile
        run: nix run --inputs-from . nixpkgs#osv-scanner -- scan source -r .

  # THE HOUSE FROM OUTSIDE: a runner is off my network, so it sees what an attacker sees. A port the
  # router mirror does not forward fails, and so does a weaker sshd: docs/notes/network/exposure.md
  exposure:
    name: what the internet can reach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: exposure-check
        run: nix run .#exposure-check --override-input duo-streak-daemon path:./tools/ci/stub-duo

  # Rule 22's clock half: an exception past its review date. It lives HERE and not in the gate,
  # because a date turns a cached, hermetic check into one whose answer changes with no commit.
  exceptions:
    name: no exception past its review date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: dead-config --expired
        run: |
          nix run .#dead-config --override-input duo-streak-daemon path:./tools/ci/stub-duo \
            -- --expired

  # A ruleset disabled for an emergency and never re-enabled fails SILENTLY, so each week this diffs
  # GitHub against .github/rulesets/: docs/notes/repo/github-settings.md
  rulesets:
    name: the live rulesets match the declared ones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Matched by NAME, the file's own key, so no ruleset id has a second owner. bypass_actors is
      # left out: a read-only token gets it as null.
      - name: diff each declared ruleset against GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fields='{name, target, enforcement, conditions, rules}'
          status=0
          for file in .github/rulesets/*.json; do
            name=$(jq -r .name "$file")
            id=$(gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq ".[] | select(.name == \"$name\") | .id")
            if [ -z "$id" ]; then
              echo "::error file=$file::ruleset '$name' does not exist on GitHub"
              status=1
              continue
            fi
            if ! diff -u <(jq -S "$fields" "$file") \
              <(gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" | jq -S "$fields"); then
              echo "::error file=$file::ruleset '$name' drifted from the declared file"
              status=1
            fi
          done
          exit "$status"

  # THE ALERT: this workflow asks a question nobody is sitting there waiting for, and its answer
  # only changes on a Monday. A red run that lands in an email is a red run I find out about a week
  # later, which turns a warning about the future into a surprise in the present. ntfy is the path
  # the machine already uses for this (modules/home/shell/ntfy.nix): the TOPIC is the password, so it is a
  # repo secret and not a literal. Why NOT `nix run` the repo's own `notify`: the runner has no
  # /run/secrets to read the topic from, and installing Nix to send one curl costs a minute.
  notify:
    name: push a failure to the phone
    needs:
      - advisories
      - exceptions
      - exposure
      - inputs
      - links
      - rulesets
      - secrets
    if: failure()
    runs-on: ubuntu-latest
    # It reads nothing and writes nothing: the token has no business existing in this job.
    permissions: {}
    steps:
      # The values arrive through env and are never interpolated into the script: a `${{ }}` inside
      # a `run` is the template injection zizmor reports, and it is one habit, not one exception.
      - name: ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ADVISORIES: ${{ needs.advisories.result }}
          EXCEPTIONS: ${{ needs.exceptions.result }}
          EXPOSURE: ${{ needs.exposure.result }}
          INPUTS: ${{ needs.inputs.result }}
          LINKS: ${{ needs.links.result }}
          RULESETS: ${{ needs.rulesets.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          # No topic provisioned sends nothing and says so, instead of failing: the run is already
          # red, and a second red mark that only means "the warning did not go out" reads as a
          # second problem. Same contract as the `notify` command on the machine.
          # Stripped for the same reason the `notify` command strips it: a secret set from a file
          # with a trailing newline yields a topic ntfy answers 400 to, which reads as nothing.
          topic="$(printf '%s' "$NTFY_TOPIC" | tr -d '[:space:]')"
          if [ -z "$topic" ]; then
            echo "NTFY_TOPIC is not set on this repo, so no alert was sent" >&2
            exit 0
          fi

          # WHICH job died is the whole message, because the two mean opposite things: `inputs` is
          # "the next update would break the config" and `links` is "a pointer in docs/ rotted".
          message="advisories: $ADVISORIES
          exceptions: $EXCEPTIONS
          exposure: $EXPOSURE
          inputs: $INPUTS
          links: $LINKS
          rulesets: $RULESETS
          secrets: $SECRETS"

          # priority 4 (high) on purpose: at 3 the phone stays quiet, and a quiet alert is the
          # email problem again with more steps.
          body="$(jq -n \
            --arg topic "$topic" \
            --arg message "$message" \
            --arg click "$RUN_URL" \
            '{topic: $topic, title: "canary failed", message: $message,
              priority: 4, tags: ["warning"], click: $click}')"

          curl --silent --show-error --fail --max-time 10 \
            --header "Content-Type: application/json" \
            --data "$body" \
            https://ntfy.sh >/dev/null
