; The island's wave: cava reads what is heard and prints one line of levels per frame, which
; Audio.qml reads. docs/notes/desktop/island.md#the-wave
[general]
framerate = 24
bars = 24
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 32
channels = mono

[smoothing]
noise_reduction = 77
